<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers · Waheguru Dairy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">🥛 Waheguru Dairy</div>
    <nav>
      <a href="/" class="active">Customers</a>
      <span class="soon" title="Coming soon">Daily Entry</span>
      <span class="soon" title="Coming soon">Bills</span>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>Customers</h1>
        <p class="muted">Active customers loaded from <code>GET /api/customers</code></p>
      </div>
      <button id="refreshBtn" class="btn">↻ Refresh</button>
    </div>

    <!-- Small summary cards -->
    <section class="stats">
      <div class="stat"><span class="stat-label">Active customers</span><span id="statCount" class="stat-value">–</span></div>
      <div class="stat"><span class="stat-label">Cow milk</span><span id="statCow" class="stat-value">–</span></div>
      <div class="stat"><span class="stat-label">Buffalo milk</span><span id="statBuffalo" class="stat-value">–</span></div>
    </section>

    <input id="search" class="search" type="search" placeholder="Search by name, phone or address…">

    <!-- Only one of these three boxes is visible at a time -->
    <div id="loading" class="box">Loading customers…</div>
    <div id="error" class="box error" hidden></div>
    <div id="empty" class="box" hidden>No customers found.</div>

    <div class="table-wrap">
      <table id="table" hidden>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Milk</th>
            <th class="num">Rate (₹/L)</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
